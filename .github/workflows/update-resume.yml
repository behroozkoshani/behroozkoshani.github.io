name: Update portfolio resume PDF
on:
  push:
    paths:
      - "scripts/update_resume.py"
      - ".github/workflows/update-resume.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install document tools and matching font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-crosextra-carlito
          python -m pip install --quiet pymupdf
      - name: Update resume and verify GitHub hyperlink
        run: python scripts/update_resume.py
      - name: Publish updated resume to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Behrooz_Koshani_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update resume PDF with Simple Port Scanner GitHub link"
            git push
          fi
