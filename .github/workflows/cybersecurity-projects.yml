name: Cybersecurity project validation
on:
  push:
    paths:
      - 'projects/**'
      - '.github/workflows/cybersecurity-projects.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/cybersecurity-projects.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cloud security tests
        run: python -m unittest discover -s projects/cloud-security-assessment -p 'test_*.py' -v
      - name: Vulnerability management tests
        run: python -m unittest discover -s projects/vulnerability-management -p 'test_*.py' -v
      - name: AD security tests
        run: python -m unittest discover -s projects/active-directory-security -p 'test_*.py' -v
      - name: Cloud analyzer smoke test
        run: |
          cd projects/cloud-security-assessment
          python cloud_security.py sample-plan.json --json > /tmp/cloud-findings.json
          python -m json.tool /tmp/cloud-findings.json > /dev/null
      - name: Vulnerability prioritization smoke test
        run: |
          cd projects/vulnerability-management
          python prioritize.py sample-vulnerabilities.csv --output /tmp/prioritized.csv
          test -s /tmp/prioritized.csv
      - name: AD audit smoke test
        run: |
          cd projects/active-directory-security
          python audit_ad.py sample-users.csv --json > /tmp/ad-findings.json
          python -m json.tool /tmp/ad-findings.json > /dev/null
