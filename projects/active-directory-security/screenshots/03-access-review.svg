<g font-family="DejaVu Sans Mono,monospace"><text x="56" y="163" font-size="20" fill="#a8e6a1">$ python3 audit_ad.py sample-users.csv --json</text><text x="56" y="199" font-size="20" fill="#f8d17a">[VERIFY] Check identity owner and group membership</text><text x="56" y="235" font-size="20" fill="#f8d17a">[REVIEW] Confirm approved service-account exceptions</text><text x="56" y="271" font-size="20" fill="#f8d17a">[APPROVE] Submit proposed disable/rotation changes</text><text x="56" y="307" font-size="20" fill="#f8d17a">[RETEST] Compare sanitized before/after inventory</text><text x="56" y="343" font-size="20" fill="#cbd5e1">No Active Directory connection or account change occurred.</text></g>
